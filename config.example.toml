[[items]]
label = "Terminal"
command = "alacritty"

[[items]]
label = "Firefox"
command = "DISPLAY=:0 MOZ_DBUS_REMOTE=1 MOZ_ENABLE_WAYLAND=1 firefox"

[[items]]
label = "VS Code"
command = "vscode --ozone-platform-hint=auto --enable-wayland-ime --new-window"

[[items]]
label = "Cmus"
command = "alacritty -e cmus"

[[items]]
label = "Hyprland"
separator_before = true

[[items.children]]
label = "Reload"
command = "hyprctl reload"

[[items.children]]
label = "Edit config"
command = "alacritty -e vim ~/.config/hypr/hyprland.lua"

[[items]]
label = "System"

[[items.children]]
label = "Lock"
command = "hyprlock"

[[items.children]]
label = "Logout"
command = "hyprctl dispatch 'hl.dsp.exit()'"

[[items.children]]
label = "Reboot"
command = "loginctl reboot"

[[items.children]]
label = "Power off"
command = "loginctl poweroff"
